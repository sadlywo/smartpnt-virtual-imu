figure_contract:
  backend: Python/matplotlib, continuing the existing project plotting workflow
  archetype: quantitative grid
  role: held-out validation and classical baseline comparison of the fixed candidate
  primary_claim: >-
    TCN improves seven of eight paired device/channel RMSEs versus identity,
    but LSM9DS1 gyro degrades and the frozen FIR/ARX methods outperform TCN.
  secondary_claim: >-
    Mean residual and centered residual both contribute to total measurement MSE;
    centered residual is not a pure sensor noise estimate.
  navigation_claim: >-
    The SmartPNT short-window ENU displacement TCN is worse than zero and train-mean
    predictions; these are window errors, not full trajectory errors.
  panels:
    figure_1: Eight panels; all seven methods, physical gyro/accel vector RMSE, all seeds
    figure_2: TCN relative improvements and squared-error fractions attributable to mean residual
    figure_3: Navigation three-dimensional, horizontal and vertical window RMSE for all four methods
  statistics: Mean and sample SD (ddof=1) across three optimization seeds; no significance tests or confidence intervals
  independent_units: Physical recordings/trajectories; overlapping samples and optimization seeds are not independent recordings
  baseline_policy: All fitted classical parameters use training data only; same evaluated timestamps/endpoints
  review_risks:
    - Preserve the LSM9DS1 gyro degradation; do not pool gyro and accel physical units
    - Mean residual is an empirical offset proxy, not an independent sensor bias calibration
    - Centered residual includes dynamic/model/reference mismatch, not only random sensor noise
    - Show deterministic baselines without implying three independent repeated measurements
    - No temperature, Allan-noise-grade, SO(3), full-navigation or hardware-upgrade claim
  dimensions:
    width_inches: 7.2
    figure_1_height_inches: 5.25
    figure_2_height_inches: 4.7
    figure_3_height_inches: 2.35
  exports: [svg_editable_text, pdf_type42, png_300dpi, tiff_600dpi]
  text: Arial/DejaVu Sans, 7 pt; panel letters 8 pt; black text and accessible method-family colours
  selected_backend_qa: All plots, contact sheets and raster/vector exports generated in Python
  official_guidance:
