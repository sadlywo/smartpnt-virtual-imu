seed: 20260712
experiment_name: penn_loso_default_bias_drift_tcn
data:
  split_manifest: data/processed/multi_imu_strict/splits/penn_loso/default_bs.json
  strict_manifest: data/processed/multi_imu_strict/manifest.json
  feature_columns:
    - gx_low
    - gy_low
    - gz_low
    - ax_low
    - ay_low
    - az_low
  window_size: 128
  stride: 64
  batch_size: 128
  num_workers: 0
  static_context:
    enabled: true
    columns:
      - gx_low
      - gy_low
      - gz_low
      - ax_low
      - ay_low
      - az_low
    window_size: 2048
    selection: auto_low_motion
    reference_scope: train_sensor
model:
  type: bias_drift_tcn
  target_mode: residual
  hidden_channels: 48
  levels: 4
  kernel_size: 5
  dropout: 0.05
  static_channels: 6
  use_bias_branch: true
  use_drift_branch: true
  bias_branch_mode: offset
  branch_init_scale: 0.1
training:
  epochs: 30
  lr: 0.001
  weight_decay: 0.00001
  lr_scheduler: reduce_on_plateau
  lr_factor: 0.5
  lr_patience: 5
  min_lr: 0.00005
  checkpoint_metric: val_score
  loss: huber
  gyro_signal_weight: 2.0
  accel_signal_weight: 1.0
  derivative_weight: 0.02
  gyro_derivative_weight: 2.0
  accel_derivative_weight: 1.0
  spectral_weight: 0.02
  gyro_spectral_weight: 2.0
  accel_spectral_weight: 1.0
  allan_weight: 0.0
  preintegration_weight: 0.005
  bias_auxiliary:
    enabled: false
    weight: 0.0
    stationary_fraction_threshold: 0.8
  grad_clip_norm: 1.0
  early_stopping_patience: 8
  device: auto
  validation_score:
    gyro_rmse_weight: 1.0
    accel_rmse_weight: 1.0
    gyro_spectral_weight: 0.3
    gyro_coherence_weight: 0.2
    preintegration_weight: 0.2
output:
  runs_dir: runs
