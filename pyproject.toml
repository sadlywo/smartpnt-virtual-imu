[project]
name = "virtual-imu"
version = "0.1.0"
description = "Learning virtual high-grade IMU signals from low-grade IMU data with SmartPNT-MSF support."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "smartpnt-virtual-imu contributors" }]
license = { text = "MIT" }
dependencies = [
  "h5py>=3.11",
  "loguru>=0.7",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.7",
  "pytest>=8.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "scipy>=1.12",
  "torch>=2.2",
  "tqdm>=4.66",
  "typer>=0.12",
]

[project.optional-dependencies]
bags = ["rosbags>=0.10"]
interactive = ["plotly>=5.20"]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
virtual-imu = "virtual_imu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_imu"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501", "B008", "N812", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["ANN201"]
"tests/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
packages = ["virtual_imu"]
