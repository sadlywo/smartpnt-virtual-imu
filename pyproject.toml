[project]
name = "virtual-imu"
version = "0.1.0"
description = "Reproducible research framework for virtual high-grade IMU learning and inertial evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "smartpnt-virtual-imu contributors" }]
license = { text = "MIT" }
dependencies = [
  "h5py>=3.11",
  "loguru>=0.7",
  "matplotlib>=3.8",
  "numpy==1.26.4",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.7",
  "pytest>=8.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "scikit-learn>=1.4,<2.0",
  "scipy>=1.12",
  "torch==2.4.0",
  "tqdm>=4.66",
  "typer>=0.12",
]

[project.optional-dependencies]
bags = ["rosbags>=0.10"]
interactive = ["plotly>=5.20"]
report = [
  "pypdf==6.10.0",
  "reportlab==4.4.9",
]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pypdf==6.10.0",
  "pytest-cov>=5.0",
  "reportlab==4.4.9",
  "ruff>=0.5",
  "threadpoolctl==3.6.0",
]

[project.scripts]
virtual-imu = "virtual_imu.cli:app"

[project.urls]
Homepage = "https://github.com/sadlywo/smartpnt-virtual-imu"
Issues = "https://github.com/sadlywo/smartpnt-virtual-imu/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
]

[tool.uv]
constraint-dependencies = ["nvidia-nvjitlink-cu12==12.1.105"]

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_imu"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501", "B008", "N812", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["ANN201"]
"tests/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires local public datasets or a prepared artifact bundle",
  "gpu: requires a CUDA-capable device and may be skipped on CPU-only runners",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
packages = ["virtual_imu"]
